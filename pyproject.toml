[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "useful-memory-horizon"
version = "0.1.0"
description = "Reproduction scripts for the Useful Memory Horizons paper"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "river>=0.22",
  "scipy>=1.13",
]

[project.scripts]
umh-research-carrier-roughness = "useful_memory_horizon.carrier_roughness_research:main"
umh-research-glue-theorem = "useful_memory_horizon.glue_theorem_research:main"
umh-research-glue-bahadur = "useful_memory_horizon.glue_theorem_bahadur:main"
umh-research-glue-bahadur-residual = "useful_memory_horizon.glue_theorem_bahadur_residual:main"
umh-research-smooth-fixed-support-bahadur = "useful_memory_horizon.smooth_fixed_support_bahadur:main"
umh-research-smooth-fixed-support-sinkhorn = "useful_memory_horizon.smooth_fixed_support_sinkhorn:main"
umh-research-sinkhorn-jacobian-probe = "useful_memory_horizon.sinkhorn_jacobian_probe:main"
umh-research-sinkhorn-moderate-band-probe = "useful_memory_horizon.sinkhorn_moderate_band_probe:main"
umh-research-twonn-moderate-band-check = "useful_memory_horizon.twonn_moderate_band_check:main"
umh-research-twonn-operational-diagnostic = "useful_memory_horizon.twonn_operational_diagnostic:main"
umh-research-glue-minimal = "useful_memory_horizon.glue_theorem_minimal:main"
umh-research-holder-lower-bound = "useful_memory_horizon.holder_lower_bound_research:main"
umh-research-sharp-family = "useful_memory_horizon.sharp_family:main"
umh-research-gaussian-witness-frontier = "useful_memory_horizon.gaussian_witness_frontier:main"
umh-generate-conceptual = "useful_memory_horizon.conceptual:main"
umh-generate-gaussian = "useful_memory_horizon.gaussian:main"
umh-generate-roughness = "useful_memory_horizon.roughness_family:main"
umh-generate-invalidity-gap = "useful_memory_horizon.invalidity_gap:main"
umh-generate-finite-sample = "useful_memory_horizon.finite_sample_geometry:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
