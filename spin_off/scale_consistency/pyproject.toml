[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "scale-consistency"
version = "0.1.0"
description = "Reproduction scripts for the scale-consistency spin-off"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
  "scipy>=1.13",
]

[project.scripts]
scale-consistency-report = "scale_consistency.report:main"
scale-consistency-plots = "scale_consistency.plots:main"

[tool.setuptools]
package-dir = {"" = "code"}

[tool.setuptools.packages.find]
where = ["code"]
